<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#070A0F" />
    <meta name="description" content="Zenith Finance - Intelligent Personal Wealth, Offline-First Expense Tracker with AI Insights and Desktop Statement Import" />
    <link rel="manifest" href="/manifest.json" />
    <title>Zenith Finance | AI Wealth & Expense Tracker</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
      <script>
      // Immediately purge legacy caches if found
      if (typeof window !== 'undefined' && 'caches' in window) {
        caches.keys().then(function(keys) {
          keys.forEach(function(key) {
            if (key !== 'zenith-finance-v2') {
              caches.delete(key);
            }
          });
        });
      }
    </script>
  </head>
  <body class="bg-[#070A0F] text-slate-100 font-sans antialiased selection:bg-emerald-500/30 selection:text-emerald-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
            .then((reg) => {
              reg.update();
            })
            .catch((err) => console.log('SW registration error:', err));
        });
      }
    </script>
  </body>
</html>
